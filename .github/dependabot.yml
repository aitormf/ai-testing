version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7      # do not propose versions published less than 7 days ago
    groups:
      dev:
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      include: "scope"     # → "chore(deps): bump ..."

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
